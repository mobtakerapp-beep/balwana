<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بالونات العيد الوطني العماني</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--red:#db161b;--green:#008000;--ink:#1d2b24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:"Cairo",Tahoma,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.wrap{width:100%;max-width:640px;padding:10px 14px 0}
.flagbar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--red) 33%,#e9e9e9 33% 66%,var(--green) 66%)}
header{display:flex;justify-content:space-between;align-items:center;margin:10px 0 6px;font-weight:700}
h1{font-size:1.15rem;margin:0;font-weight:900}
.hud{display:flex;gap:14px;align-items:center;font-size:1rem}
.hearts{color:var(--red);letter-spacing:2px;font-size:1.2rem}
.q{background:#fff;border:3px solid var(--green);border-radius:16px;padding:8px 12px;font-size:1.2rem;font-weight:900;min-height:110px;display:flex;align-items:center;justify-content:center;gap:14px;text-align:center}
.q img{width:96px;height:96px;border-radius:12px;border:2px solid #e3e3e3;object-fit:cover;flex:none}.q img[hidden]{display:none}
.field{position:relative;height:60vh;min-height:400px;max-height:620px;margin-top:10px;overflow:hidden;border-bottom:4px solid var(--red);background:#fff}
.balloon{position:absolute;top:0;border-radius:50% 50% 48% 48%/56% 56% 44% 44%;cursor:pointer;touch-action:manipulation;border:3px solid rgba(0,0,0,.12);box-shadow:inset -8px -10px 0 rgba(0,0,0,.12),inset 8px 8px 0 rgba(255,255,255,.18)}
.balloon.red{background:var(--red)}.balloon.green{background:var(--green)}.balloon.white{background:#fff;border-color:#bdbdbd;box-shadow:inset -8px -10px 0 rgba(0,0,0,.07)}
.balloon .tx{position:absolute;inset:10% 9% 18% 9%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;line-height:1.35;pointer-events:none}
.balloon.red .tx,.balloon.green .tx{color:#fff}.balloon.white .tx{color:#1d2b24}
.balloon::after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom:11px solid currentColor}
.balloon.red::after{color:var(--red)}.balloon.green::after{color:var(--green)}.balloon.white::after{color:#bdbdbd}
.balloon .str{position:absolute;left:50%;top:100%;width:2px;height:28px;margin-top:2px;background:#9a9a9a}
.balloon.pop{transition:transform .18s,opacity .18s;transform:scale(1.4)!important;opacity:0}
.balloon.shake{animation:sh .3s}
@keyframes sh{25%{margin-left:-8px}75%{margin-left:8px}}
.toast{position:absolute;left:0;right:0;top:42%;text-align:center;font-size:1.6rem;font-weight:900;pointer-events:none;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.ov{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px;z-index:5}
.ov h2{margin:0;font-size:1.6rem;font-weight:900}.ov p{margin:0;font-size:1.05rem;line-height:1.7}
button{font:inherit;font-weight:900;font-size:1.2rem;color:#fff;background:var(--green);border:0;border-radius:14px;padding:12px 34px;cursor:pointer;box-shadow:0 4px 0 #005a00}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #005a00}
button:focus-visible,.balloon:focus-visible{outline:3px solid var(--red);outline-offset:3px}
footer{width:100%;max-width:640px;padding:16px 14px 22px;text-align:center;font-weight:700;line-height:2;font-size:1.05rem}
footer span{display:block}
.hidden{display:none}
@media (prefers-reduced-motion:reduce){.balloon.pop,.toast{transition:none}.balloon.shake{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="flagbar"></div>
  <header>
    <h1>العيد الوطني العماني</h1>
    <div class="hud"><span>النقاط: <b id="score">0</b></span><span class="hearts" id="hearts" aria-label="المحاولات"></span></div>
  </header>
  <div class="q"><img id="qimg" alt="" hidden><span id="qt">اضغط على «ابدأ» للعب</span></div>
  <div class="field" id="field">
    <div class="toast" id="toast"></div>
    <div class="ov" id="ov">
      <h2>لعبة البالونات 🎈</h2>
      <p>شوف الصورة واقرأ السؤال، ثم اضغط على البالون الذي فيه الإجابة الصحيحة قبل أن ينزل!</p>
      <button id="go">ابدأ</button>
    </div>
  </div>
</div>
<footer>
  <span>الأخصائية النفسية: أسماء الهاشمي</span>
  <span>مديرة المدرسة: شيخة المطاعني</span>
</footer>

const Q=[["مما يتكون علم سلطنة عُمان؟", "flag", "أحمر وأبيض وأخضر", ["أزرق وأصفر وأحمر", "أسود وأبيض وأخضر", "أخضر وأصفر وأبيض"]], ["ماذا يوجد في شعار عُمان؟", "khanjar", "خنجر وسيفان", ["نخلة وجمل", "هلال ونجمة", "قلعة وبرج"]], ["ما اسم هذه الشجرة المباركة؟", "palm", "نخلة التمر", ["شجرة الموز", "شجرة الليمون", "شجرة الزيتون"]], ["ما اسم هذه الأداة التي نحرق فيها اللبان؟", "mabkhara", "المبخرة", ["الفانوس", "الإبريق", "القِدر"]], ["ماذا يلبس الولد العُماني على رأسه؟", "kids", "الكُمّة", ["القبعة", "الخوذة", "الطاقية الصوفية"]], ["ما اسم عملة سلطنة عُمان؟", "money", "الريال العُماني", ["الدرهم", "الدينار", "الجنيه"]], ["ما اسم هذا المبنى التاريخي القديم؟", "fort", "قلعة", ["مصنع", "مطار", "ملعب"]], ["ما هي عاصمة سلطنة عُمان؟", "palace", "مسقط", ["صلالة", "صحار", "نزوى"]], ["أي حيوان يظهر مع الأطفال في الاحتفال؟", "party", "الجمل", ["الحصان", "الأسد", "الفيل"]], ["ما اسم هذا الجامع الكبير في مسقط؟", "mosque", "جامع السلطان قابوس الأكبر", ["المسجد الحرام", "المسجد الأقصى", "المسجد النبوي"]]];
const COL=["red","white","green"];
const $=id=>document.getElementById(id);
const field=$("field");
let qi,score,lives,balls,last,raf,locked,cur;
function hearts(){$("hearts").textContent="♥".repeat(lives)+"♡".repeat(3-lives)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function toast(t,c){const e=$("toast");e.textContent=t;e.style.color=c;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),900)}
function clear(){balls.forEach(b=>b.el.remove());balls=[]}
function round(){
  clear();locked=false;
  cur=Q[qi];$("qt").textContent=cur[0];const qi_=$("qimg");qi_.src=IMG[cur[1]];qi_.hidden=false;
  const opts=shuffle([cur[2],...cur[3]]);
  const W=field.clientWidth,H=field.clientHeight;
  const bw=Math.min(W*0.33,118),bh=bw*1.2,gap=(W-2*bw)/3,st=bh*0.78;
  const cols=shuffle([...COL,COL[Math.floor(Math.random()*3)]]);
  const first=Math.random()<.5?0:1,v=H*(0.15+qi*0.004);
  opts.forEach((k,i)=>{
    const el=document.createElement("div");
    el.className="balloon "+cols[i];el.tabIndex=0;el.setAttribute("role","button");
    el.style.width=bw+"px";el.style.height=bh+"px";
    el.style.left=(gap+((i+first)%2)*(bw+gap))+"px";
    el.innerHTML='<span class="tx" style="font-size:'+(bw*0.15)+'px">'+k+'</span><span class="str"></span>';
    const b={el,k,y:-bh-i*st,v,h:bh};
    el.onclick=()=>pick(b);
    el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick(b)}};
    field.appendChild(el);balls.push(b);
  });
}
function pop(b){
  balls=balls.filter(x=>x!==b);
  const r=b.el.getBoundingClientRect(),f=field.getBoundingClientRect();
  const cx=r.left-f.left+r.width/2,cy=r.top-f.top+r.height/2,sz=r.width;
  b.el.remove();
  const ring=document.createElement("div");
  ring.style.cssText="position:absolute;pointer-events:none;border-radius:50%;border:4px solid #db161b;width:"+sz*0.5+"px;height:"+sz*0.5+"px;left:"+(cx-sz*0.25)+"px;top:"+(cy-sz*0.25)+"px;z-index:4";
  field.appendChild(ring);
  ring.animate([{transform:"scale(.3)",opacity:1},{transform:"scale(2.4)",opacity:0}],{duration:380,easing:"ease-out"}).onfinish=()=>ring.remove();
  const cl=["#db161b","#008000","#ffffff","#f5c518","#db161b","#008000"];
  for(let i=0;i<16;i++){
    const s=document.createElement("div"),a=(i/16)*Math.PI*2+Math.random()*.4,d=sz*(.55+Math.random()*.7),z=5+Math.random()*7;
    s.style.cssText="position:absolute;pointer-events:none;z-index:4;border-radius:"+(i%3?"50%":"2px")+";width:"+z+"px;height:"+z+"px;left:"+(cx-z/2)+"px;top:"+(cy-z/2)+"px;background:"+cl[i%6]+";border:1px solid rgba(0,0,0,.18)";
    field.appendChild(s);
    s.animate([{transform:"translate(0,0) scale(1)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+(Math.sin(a)*d+18)+"px) scale(.3) rotate(200deg)",opacity:0}],{duration:520+Math.random()*200,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>s.remove();
  }
}
function lose(msg){
  lives--;hearts();toast(msg,"#db161b");
  if(lives<=0){setTimeout(end,900);locked=true;return false}
  return true;
}
function pick(b){
  if(locked)return;
  if(b.k===cur[2]){
    locked=true;score+=10;$("score").textContent=score;toast("أحسنت! 🎉","#008000");
    pop(b);balls.slice().forEach(x=>pop(x));
    qi++;setTimeout(()=>{qi>=Q.length?end():round()},1000);
  }else{
    b.el.classList.add("shake");
    const ok=lose("حاول مرة ثانية");pop(b);
  }
}
function tick(t){
  const dt=Math.min((t-last)/1000,.05);last=t;
  const H=field.clientHeight;
  if(!locked){
    balls.slice().forEach(b=>{
      b.y+=b.v*dt;b.el.style.transform="translateY("+b.y+"px)";
      if(b.y>H){
        b.el.remove();balls=balls.filter(x=>x!==b);
        if(b.k===cur[2]){locked=true;balls.slice().forEach(x=>x.el.remove());balls=[];if(lose("فاتك البالون الصحيح"))setTimeout(round,900)}
      }
    });
    if(!locked&&balls.length===0)round();
  }
  raf=requestAnimationFrame(tick);
}
function end(){
  cancelAnimationFrame(raf);clear();locked=true;
  const win=lives>0;
  $("ov").innerHTML='<h2>'+(win?"ما شاء الله! 🇴🇲":"انتهت المحاولات")+'</h2><p>نقاطك: <b>'+score+'</b> من '+Q.length*10+'</p><p>'+(win?"عاش عُمان! أنت تعرف رموز وطنك.":"حاول مرة ثانية، وتعلّم رموز وطنك.")+'</p><button id="go">العب مرة ثانية</button>';
  $("ov").classList.remove("hidden");$("go").onclick=start;
}
function start(){
  qi=0;score=0;lives=3;balls=[];locked=false;$("score").textContent=0;hearts();
  $("ov").classList.add("hidden");round();
  last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
$("go").onclick=start;hearts();
</script>
